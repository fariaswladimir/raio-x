    metrica: "Coocorrência das formas plenas mais frequentes nos mesmos segmentos (índice bruto, padrão do IRaMuTeQ; também Jaccard, cosseno e PMI); árvore geradora máxima por Kruskal (empate pela ordem das formas)."
