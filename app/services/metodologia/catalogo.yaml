      - "Se o corpus muda, comentários aceitos cujo número ou evidência mudou voltam para 'revisar'."
    referencias: []
    deteccao: {tabelas: [comentario]}

  # =====================================================================================================
  # Frente 16: corpus e metadados
  # =====================================================================================================
  - id: planilha_corpus
    nome: "Planilha do corpus (extração por seções e padrões)"
    familia: "Corpus e metadados"
    status: implementado
    eap_id: "16.1, 16.2, 16.4"
    modulo: "app/services/corpus/partes.py"
    o_que_mede: "Não mede: organiza, por documento, trechos literais de cada parte do artigo (resumo, introdução, objetivo, perguntas, referencial, método, dados, resultados, discussão, conclusão, limitações, trabalhos futuros, contribuições) com página e origem."
    metrica: "Partes de seção: frases da seção detectada (3.1) até um limite de caracteres, cortando no fim da frase. Partes por padrão: frases pontuadas por expressões de cue em inglês, português e espanhol (força do padrão, seção preferida, posição); as melhores entram, citadas literalmente. Sem trecho: 'não encontrado'. Opcional (LLM desligado por padrão): frases literais sugeridas e conferidas contra o texto, aceitas uma a uma."
    parametros_padrao:
      - {nome: "Limite de caracteres por seção", valor: "1500", parametro: "planilha_corpus.max_caracteres"}
      - {nome: "Frases por célula de padrão", valor: "3", parametro: "planilha_corpus.max_frases"}
      - {nome: "Nota mínima do padrão", valor: "2,0", parametro: "planilha_corpus.nota_minima"}
    equivale_a: "Matriz de extração de dados de uma revisão da literatura (planilha de coleta), preenchida por regras."
    nao_e_igual_a: "Resumo automático nem codificação temática: os trechos são citações, não interpretações."
    cuidados:
      - "A detecção de seções e frases é heurística; confira o trecho no documento antes de citar."
      - "Um padrão pode achar frase que não é o objetivo ou a limitação do estudo; 'não encontrado' não prova que a parte não existe. Limitações exigem cue + semântica de limitação (refinado em 12/10/2026) e ignoram itens de checklist de conferência."
    referencias: []
    deteccao: {}

  - id: exportacao_bibliometrix
    nome: "Exportação bibliométrica (bibliometrix)"
    familia: "Corpus e metadados"
    status: implementado
    eap_id: "16.3, 16.4"
    modulo: "app/services/corpus/bibtex.py"
    o_que_mede: "Não mede: exporta os metadados e as referências citadas dos documentos em BibTeX no padrão do Scopus, para análises bibliométricas no pacote bibliometrix (R)."
    metrica: "Uma entrada por documento (@ARTICLE, @CONFERENCE, @BOOK, @INCOLLECTION ou @MISC) com author, title, journal, year, doi, affiliations, abstract, author_keywords e references; as referências vêm da seção de Referências, separadas e interpretadas por regras (autores, ano, título, fonte), com o texto bruto quando não há interpretação. Lido com convert2df(dbsource = 'scopus', format = 'bibtex')."
    parametros_padrao:
      - {nome: "Escape BibTeX", valor: "completo"}
      - {nome: "Confiança mínima do metadado", valor: "0,35"}
    equivale_a: "Export BibTeX do Scopus."
    nao_e_igual_a: "Dados da base Scopus: não há contagem de citações recebidas, palavras-chave indexadas nem afiliações normalizadas."
    cuidados:
      - "As referências são interpretadas por regras e parte delas fica só como texto bruto: a rede de cocitação é aproximada."
      - "Metadados vindos só do texto têm confiança menor: confira ou importe o índice da revisão."
    referencias: [aria2017]
    deteccao: {}

  - id: exportacao_coleta_mlr
    nome: "Exportação para a planilha de coleta da MLR"
    familia: "Corpus e metadados"
    status: implementado
    eap_id: "9.5"
    modulo: "app/services/concordancia/exportacao_coleta.py"
    o_que_mede: "Não mede: gera um .xlsx novo com os trechos escolhidos no Raio-X (evidências de comentários aceitos, ocorrências do KWIC, células da planilha do corpus e trechos codificados pelo LLM) nas mesmas colunas da aba de trechos da planilha de coleta do usuário."
    metrica: "Uma linha por trecho literal, com documento, página, seção, código e tema quando conhecidos, 'Motivo da coleta' = 'Raio-X: <análise>' e tradução vazia. Duplicatas contra a planilha do usuário (somente leitura) são achadas por texto normalizado (igual ou mesmo início de 60 caracteres) e marcadas, ou omitidas."
    parametros_padrao:
      - {nome: "Planilha de referência", valor: "caminho informado na tela (opcional; copia o cabeçalho e checa duplicatas)"}
      - {nome: "Duplicados", valor: "marcados (ou omitidos)"}
    equivale_a: "Preenchimento manual da aba de trechos temáticos da planilha de coleta."
    nao_e_igual_a: "Codificação temática: código e tema só vão preenchidos quando já existem (codificação LLM); tradução, trilha, QP e decisão do revisor ficam em branco."
    cuidados:
      - "O arquivo gerado é novo: a planilha do usuário nunca é alterada. Os IDs de registro 'RX-...' são provisórios e devem ser renumerados ao colar na coleta."
      - "A coluna 'Sentença verificada (auto)' só diz se o trecho foi achado no texto do documento; a conferência continua sendo do revisor."
    referencias: []
    deteccao: {}

  # =====================================================================================================
  # Frente 17: coleta guiada por protocolo
  # =====================================================================================================
  - id: coleta_protocolo
    nome: "Coleta guiada por protocolo (extração de dados por item)"
    familia: "Coleta de dados"
    status: implementado
    eap_id: "17.1, 17.2, 17.3"
    modulo: "app/services/coleta/motor.py"
    o_que_mede: "Não mede: preenche, para cada documento e cada item de um protocolo de coleta (id, nome, definição de até 2 frases, tipo de resposta, categorias, onde procurar, palavras-chave), um valor com trechos literais, página e origem, para revisão humana."
    metrica: "Candidatos: frases das seções indicadas e frases que casam as palavras-chave (por lema, com curinga, frases e expressões regulares). Extratores por tipo: número (n = 312, 1.200 empresas, sample of 1,200 firms; separador de milhar pt/en), sim/não (presença da palavra-chave e negação próxima), data/ano, categoria (palavras-chave por categoria; empate vira 'ambíguo') e texto (frases de maior nota). Itens ligados a uma parte da planilha do corpus usam as regras da 16.1. Opcional (LLM desligado por padrão): o modelo devolve JSON com valor e frases copiadas; cada frase é conferida literalmente no documento (com a página), categoria fora da lista e número que não aparece no trecho são recusados. Sem evidência, 'não encontrado'. Cada célula guarda valor, trechos, origem (regra, padrão, LLM, humano), confiança, status (sugerido, aceito, editado, rejeitado, não encontrado) e justificativa; a execução é incremental e nunca sobrescreve o que o revisor decidiu. Concordância por item: kappa de Cohen e alfa de Krippendorff (15.1)."
    parametros_padrao:
      - {nome: "Frases por definição", valor: "no máximo 2 (aviso acima de ~40 palavras)"}
      - {nome: "Trechos por célula", valor: "3 (por item)"}
      - {nome: "LLM", valor: "desligado (faltantes ou todos os itens, se ligado em Configurações)"}
    equivale_a: "Formulário de extração de dados de uma revisão sistemática ou multivocal (protocolo de coleta), preenchido por regras e revisado por duas pessoas."
    nao_e_igual_a: "Codificação temática nem resumo automático: o valor sai de trechos literais do documento; sem trecho, fica 'não encontrado'."
    cuidados:
      - "As regras são heurísticas (palavras-chave, padrões de número e data): um valor sugerido pode vir de outro estudo citado no texto; a revisão humana de cada célula é obrigatória antes de usar."
      - "O LLM, quando ligado, só vale com frases literais do documento (verificadas); 'não encontrado' não prova que o documento não trata do item."
      - "A concordância (kappa, alfa) com a sugestão automática mede o acerto da coleta, não a validade do protocolo; informe a faixa e o número de pares."
    referencias: [kitchenham2007, garousi2019, cohen1960, krippendorff2018]
    deteccao: {}

