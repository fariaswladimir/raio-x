    metrica: "Prompt com as definições dos rótulos (zero-shot) ou com até k exemplos por rótulo tirados da codificação humana (few-shot, escolhidos de forma determinística por hash e deixados fora da avaliação); saída em JSON, revisável item a item (aceitar/rejeitar) e comparável com os rótulos humanos (percentual, kappa de Cohen, alfa de Krippendorff)."
    parametros_padrao:
      - {nome: "Unidade", valor: "trechos codificados (padrão), segmentos do corpus ou documentos (início do texto limpo, 3000 caracteres)"}
      - {nome: "Modo", valor: "zero-shot (padrão) ou few-shot com k = 3 exemplos por rótulo"}
      - {nome: "Multirrótulo", valor: "desligado (um rótulo ou nenhum); ligado aceita vários"}
