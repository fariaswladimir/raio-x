  - id: busca_semantica_rag
    nome: "Perguntar ao corpus: busca BM25, híbrida (RRF) e RAG com citação de página"
    familia: "LLM"
    status: implementado
    eap_id: "15.13"
    modulo: "app/services/busca/rag.py"
    o_que_mede: "Recupera os trechos do corpus mais relevantes para uma pergunta, com documento e página; opcionalmente, o LLM redige uma resposta que só pode citar esses trechos."
    metrica: "BM25 (Okapi, k1 = 1,5, b = 0,75, idf não negativo) sobre os segmentos; com embeddings (15.12), fusão do ranking BM25 com o do cosseno por reciprocal rank fusion (k = 60). A resposta do LLM é conferida (números, citações (rótulo, p. N) e trechos entre aspas) contra os trechos recuperados e mostrada com avisos se falhar."
    formula: "score(d) = soma idf(t) f (k1 + 1) / (f + k1 (1 - b + b |d| / avgdl))"
    parametros_padrao:
      - {nome: "Trechos recuperados (k)", valor: "8"}
      - {nome: "Modo", valor: "automático: híbrido se houver embeddings, senão só BM25"}
      - {nome: "Resposta do LLM", valor: "desligada por padrão; nunca há resposta sem trechos recuperados"}
    equivale_a: "RAG (retrieval-augmented generation) sobre corpus próprio."
    nao_e_igual_a: "Concordância por palavra (KWIC), que mostra todas as ocorrências de um termo, e busca vetorial pura."
    cuidados:
      - "A busca lexical não lematiza: usa só radical mínimo (plural em s) e não acha sinônimos; a híbrida ajuda quando há embeddings."
      - "A resposta só vale com os trechos citados: confira cada página no documento; a conferência automática não detecta interpretação indevida."
      - "Textos idênticos em documentos diferentes aparecem uma vez, com a indicação de onde mais ocorrem."
    referencias: [robertson2009, cormack2009, lewis2020]
    deteccao: {}

  - id: similaridade_semantica_embeddings
    nome: "Similaridade semântica por embeddings (Ollama)"
    familia: "LLM"
    status: implementado
    eap_id: "15.12"
    modulo: "app/services/busca/embeddings.py"
    o_que_mede: "O quanto dois documentos (ou um segmento e uma pergunta) se parecem em sentido, e não só em vocabulário."
    metrica: "Embeddings dos segmentos calculados por um modelo do Ollama local (ex.: nomic-embed-text), normalizados em L2 e guardados em cache (.npy); o vetor do documento é a média renormalizada dos seus segmentos; similaridade = cosseno."
    formula: "cos(u, v) = u . v / (|u| |v|)"
    parametros_padrao:
      - {nome: "Provedor", valor: "somente Ollama (local); nada sai da máquina"}
      - {nome: "Modelo", valor: "um modelo de embeddings instalado (a tela lista os disponíveis)"}
    equivale_a: "Similaridade de documentos por embeddings de sentenças."
    nao_e_igual_a: "Similaridade por TF-IDF (6.3), que compara vocabulário."
    cuidados:
      - "Depende do modelo de embeddings: registre o modelo (fica no meta.json do cache) e não misture modelos."
      - "Opcional: sem Ollama e sem modelo de embeddings, a tela explica como habilitar e o resto do sistema segue igual."
    referencias: []
    deteccao: {}

