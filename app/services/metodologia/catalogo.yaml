  - id: codificacao_llm_concordancia
    nome: "Codificação por LLM e concordância (kappa, alfa)"
    familia: "LLM"
    status: implementado
    eap_id: "15.1"
    modulo: "app/services/concordancia/estatisticas.py"
    o_que_mede: "O quanto a codificação feita pelo LLM concorda com a codificação humana, por código e no geral."
    metrica: "Kappa de Cohen (dois codificadores, escala nominal) e alfa de Krippendorff, calculados sobre os trechos da planilha de coleta como referência."
    formula: "kappa = (po - pe) / (1 - pe)"
    parametros_padrao:
      - {nome: "Unidades", valor: "trechos com código humano importados da planilha (.xlsx)"}
      - {nome: "LLM", valor: "segundo codificador às cegas (codebook + trecho), um código ou nenhum"}
      - {nome: "IC 95%", valor: "kappa: EP assintótico (Fleiss, Cohen & Everitt 1969) e bootstrap; alfa: bootstrap por unidades (1000 réplicas, semente 42)"}
      - {nome: "Alfa", valor: "nominal (ordinal, intervalar e razão disponíveis), com faltantes"}
    equivale_a: "Confiabilidade entre codificadores na análise de conteúdo."
    nao_e_igual_a: "Percentual simples de concordância, que não corrige o acaso."
    cuidados:
      - "Kappa depende da prevalência dos códigos: leia junto com a tabela de confusão."
      - "Concordância alta com o humano não prova validade do código; o LLM é segundo codificador, não substitui o humano."
      - "Leitura: Landis & Koch (1977) para kappa; alfa >= 0,800 confiável, >= 0,667 provisório."
    referencias: [cohen1960, fleiss1969, landis1977, krippendorff2011, krippendorff2018, hayes2007]
    deteccao: {}

  - id: classificacao_zero_few_shot
