    deteccao: {snapshots: [similitude]}

  - id: rede_coocorrencia
    nome: "Rede de coocorrência (Jaccard)"
    familia: "Redes"
    status: implementado
    eap_id: "7.2"
    modulo: "app/services/analises/similitude.py"
    o_que_mede: "Quais palavras tendem a aparecer juntas nos mesmos segmentos."
    metrica: "Coeficiente de Jaccard entre as palavras por segmento (interseção sobre união dos conjuntos de segmentos em que cada uma ocorre); cada palavra mantém suas k arestas mais fortes (ou todas acima de um limiar)."
    formula: "J(a, b) = |S_a interseção S_b| / |S_a união S_b|"
    parametros_padrao:
      - {nome: "Segmento", valor: "40 palavras (ver segmentação)", parametro: "segmento_palavras"}
      - {nome: "Formas", valor: "60 mais frequentes", parametro: "similitude"}
      - {nome: "Arestas por palavra", valor: "3 (ou limiar de peso)"}
    equivale_a: "Co-occurrence network do KH Coder."
    nao_e_igual_a: "Links do Voyant (rede em torno de um termo) e similitude (árvore)."
    cuidados:
      - "O número de arestas por palavra (ou o limiar) altera muito o desenho da rede."
    referencias: [jaccard1912, higuchi2016, brezina2015]
    deteccao: {snapshots: [similitude]}

  - id: rede_comunidades_centralidade
    nome: "Rede: comunidades, centralidade e layout"
    familia: "Redes"
    status: implementado
    eap_id: "15.2"
    modulo: "app/services/analises/similitude.py"
    o_que_mede: "Grupos de palavras fortemente ligadas (comunidades), palavras centrais na rede e um desenho legível."
    metrica: "Comunidades por Louvain (networkx, ponderado) com modularidade; grau, grau ponderado, intermediação (Brandes, distância = 1/peso) e PageRank ponderado (0,85); layout Fruchterman-Reingold calculado no servidor; semente fixa (42)."
    parametros_padrao:
      - {nome: "Semente", valor: "42 (Louvain e layout)"}
      - {nome: "Resolução do Louvain", valor: "1"}
      - {nome: "Iterações do layout", valor: "200"}
    equivale_a: "Comunidades e centralidades do KH Coder e do Gephi; halos de comunidade da similitude do IRaMuTeQ."
    nao_e_igual_a: "Classes da CHD (7.1)."
    cuidados:
      - "Louvain é sensível à ordem e à semente; a resolução muda o número de comunidades. Leiden não está disponível (exige leidenalg/igraph)."
      - "Numa árvore, a intermediação concentra-se nos nós internos e é zero nas folhas."
      - "A posição no layout não tem significado estatístico."
    referencias: [blondel2008, traag2019, fruchterman1991, freeman1977, page1999]
    deteccao: {}

  # =====================================================================================================
  # Estilometria
  # =====================================================================================================
  - id: estilometria_delta
    nome: "Estilometria (Delta de Burrows e variantes)"
    familia: "Estilometria"
    status: implementado
    eap_id: "15.6"
    modulo: "app/services/analises/estilometria.py"
    o_que_mede: "Distância de estilo entre documentos (ou amostras de tamanho fixo) a partir das frequências das palavras mais frequentes, sobretudo palavras funcionais."
    metrica: "Delta clássico (Burrows), Delta quadrático de Argamon, Delta de Eder, Delta simples de Eder, Cosine Delta (Würzburg) e cosseno das frequências, com as definições do stylo 0.7.71; agrupamento hierárquico (ward.D ou ligação média), consenso entre faixas de MFW, PCA (correlação/covariância) com cargas e MDS."
    formula: "z = (f - média)/dp amostral; Delta clássico = (1/n) soma |z_i(A) - z_i(B)|; Argamon = raiz(soma (z_i(A) - z_i(B))^2)/n; Eder = soma |w_i (z_i(A) - z_i(B))|, w_i = (n - i + 2)/n (código do stylo; a fórmula costuma ser citada com (n - i + 1)/n); Eder simples = soma |raiz f_i(A) - raiz f_i(B)|; Cosine Delta = 1 - cos(z(A), z(B))"
    parametros_padrao:
      - {nome: "Palavras mais frequentes (MFW)", valor: "100 formas em minúsculas, com palavras vazias", parametro: "estilometria.mfw"}
      - {nome: "Culling", valor: "0% (palavra presente em pelo menos c% das unidades)", parametro: "estilometria.culling"}
      - {nome: "Distância", valor: "Delta clássico", parametro: "estilometria.distancia"}
      - {nome: "Unidade", valor: "documento (ou amostras de tamanho fixo)", parametro: "estilometria.unidade"}
      - {nome: "Tamanho da amostra", valor: "2.000 tokens", parametro: "estilometria.tamanho_amostra"}
      - {nome: "Agrupamento e consenso", valor: "Ward (ward.D, como o stylo), k pela silhueta; consenso entre MFW 100, 200, ..., 500"}
      - {nome: "Ruído", valor: "só o corpo, sem referências nem segmentos de ruído", parametro: "limpeza.excluir_ruido"}
    equivale_a: "Pacote stylo (R): dist.delta, dist.argamon, dist.eder, dist.simple, dist.wurzburg, dist.cosine, Cluster Analysis, PCA e árvore de consenso (BCT). Distâncias, alturas do hclust, PCA, MDS e frequências de clados conferidos contra o stylo 0.7.71 até 1e-9."
    nao_e_igual_a: "Atribuição de autoria (supervisionada ou não): não há autores rotulados neste corpus. A árvore de consenso é uma aproximação (árvores por faixa de MFW, sem reamostragem)."
    cuidados:
      - "Neste corpus os documentos têm muitos autores e gêneros (artigo, relatório, capítulo) e mais de um idioma: a distância estilométrica reflete sobretudo gênero/registro, idioma e tradução, não autoria. No corpus MLR o primeiro corte separa os textos em português/espanhol dos em inglês, e o seguinte separa os artigos de benchmark de agentes (computação) dos textos de economia/empreendedorismo e relatórios."
      - "Textos de extensões muito diferentes: prefira amostras de tamanho fixo; documentos com menos tokens do que uma amostra saem da análise."
      - "Os agrupamentos mudam com o número de MFW: confira a tabela de consenso e a varredura antes de interpretar um grupo."
    referencias: [burrows2002, argamon2008, smith2011, evert2017, eder2016, eder2017]
    deteccao: {snapshots: [estilometria]}

  # =====================================================================================================
  # Legibilidade
  # =====================================================================================================
  - id: legibilidade
    nome: "Legibilidade (Flesch, Gunning Fog, Coleman-Liau, SMOG)"
    familia: "Legibilidade"
    status: implementado
    eap_id: "15.3"
    modulo: "app/services/analises/legibilidade.py"
    o_que_mede: "O quanto um texto é fácil de ler, estimado por tamanho de frases, de palavras e de sílabas."
    metrica: "Flesch (EN), Flesch adaptado ao português (Martins et al.), Flesch-Kincaid, Gunning Fog, Coleman-Liau e SMOG, calculados por documento sobre o corpo do texto (sem referências nem ruído); a fórmula principal é a do idioma do documento."
    formula: "Flesch EN = 206,835 - 1,015 ASL - 84,6 ASW; Flesch PT = 248,835 - 1,015 ASL - 84,6 ASW; Kincaid = 0,39 ASL + 11,8 ASW - 15,59; Fog = 0,4 (ASL + 100 complexas/palavras); Coleman-Liau = 0,0588 L - 0,296 S - 15,8; SMOG = 1,043 raiz(polissílabos x 30/frases) + 3,1291"
    parametros_padrao:
      - {nome: "Frases", valor: "divisão por regra documentada (abreviações, números, títulos descartados)"}
      - {nome: "Sílabas EN", valor: "heurística de grupos vocálicos (pyphen opcional)", parametro: "documento_extra.silabas_en"}
      - {nome: "Sílabas PT/ES", valor: "núcleos vocálicos (ditongos e hiatos por regra)"}
      - {nome: "Ruído", valor: "segmentos de ruído fora do texto", parametro: "limpeza.excluir_ruido"}
    equivale_a: "Fórmulas clássicas de legibilidade (textstat, Coh-Metrix básico)."
    nao_e_igual_a: "Medida de compreensão por leitores reais."
    cuidados:
      - "A contagem de sílabas depende do idioma; as fórmulas do inglês não valem para o português (Fog, Kincaid, Coleman-Liau e SMOG só comparam documentos entre si em português)."
      - "Artigos científicos têm siglas, fórmulas e tabelas que distorcem as médias: confira o número de frases e os avisos de confiabilidade."
      - "Textos acadêmicos saem como muito difíceis (Flesch EN abaixo de 30) por natureza; compare entre documentos, não com textos gerais."
    referencias: [flesch1948, martins1996, kincaid1975, gunning1952, coleman1975, mclaughlin1969]
    deteccao: {snapshots: [documento_extra]}

  # =====================================================================================================
  # PLN
  # =====================================================================================================
  - id: palavras_chave_documento
    nome: "Palavras-chave por documento (RAKE, YAKE, TextRank)"
    familia: "PLN"
    status: implementado
    eap_id: "15.4"
    modulo: "app/services/analises/palavras_chave.py"
    o_que_mede: "Expressões que resumem um documento, extraídas dele mesmo, sem corpus de comparação."
    metrica: "RAKE (grau e frequência de palavras em candidatos delimitados por palavras vazias), YAKE (caixa, posição, frequência, relação com o contexto e dispersão; implementação própria, menor é melhor) e TextRank (PageRank no grafo de coocorrência de lemas, janela 2 a 10, sem etiquetador), comparados lado a lado com os termos distintivos TF-IDF (5.1)."
    formula: "RAKE: pontuação(frase) = soma de grau(w)/freq(w); YAKE: S(t) = rel x pos / (caixa + freq/rel + dif/rel), S(kw) = produto de S(t) / (TF(kw) (1 + soma de S(t)))"
    parametros_padrao:
      - {nome: "Palavras-chave por método", valor: "10", parametro: "documento_extra.n_palavras_chave"}
      - {nome: "RAKE: palavras por frase / frequência mínima", valor: "até 4 / 2 (documentos com 1.500+ palavras)", parametro: "documento_extra.rake"}
      - {nome: "YAKE: n-grama máximo / similaridade de desduplicação", valor: "3 / 0,8", parametro: "documento_extra.yake"}
      - {nome: "TextRank: janela / palavras por frase", valor: "4 / 4", parametro: "documento_extra.textrank"}
    equivale_a: "Extração de palavras-chave de documento único (rake-nltk, yake, pytextrank)."
    nao_e_igual_a: "Keyness (compara grupos) e TF-IDF (compara com o corpus)."
    cuidados:
      - "Métodos diferentes dão listas diferentes; compare e escolha por inspeção. No corpus MLR, YAKE e TextRank acompanharam o TF-IDF; o RAKE trouxe frases de método e figura."
      - "Cabeçalhos repetidos por página (nomes de autores) viram palavras-chave do RAKE em documentos que o detector de ruído não limpou."
      - "O TextRank não usa etiquetador (só palavras vazias): verbos vizinhos entram nas frases."
    referencias: [rose2010, campos2020, mihalcea2004]
    deteccao: {snapshots: [documento_extra]}

  - id: sumarizacao_extrativa
    nome: "Sumarização extrativa (TextRank, LexRank, MMR)"
    familia: "PLN"
    status: implementado
    eap_id: "15.5"
    modulo: "app/services/analises/sumarizacao.py"
    o_que_mede: "As frases mais representativas de cada documento, com a página de onde vêm."
    metrica: "Pontuação de frases por centralidade em grafo de similaridade (TextRank com a similaridade do artigo; LexRank com cosseno TF-IDF e limiar 0,1) e seleção com diversidade (MMR, lambda 0,7), em ordem original, com página e seção; frases de legenda, sumário, URL e fragmentos ficam de fora."
    formula: "TextRank: sim = |comuns| / (ln|S1| + ln|S2|); MMR = lambda cos(frase, centroide) - (1 - lambda) max cos(frase, escolhidas)"
    parametros_padrao:
      - {nome: "Frases no resumo", valor: "5", parametro: "documento_extra.resumo_frases"}
      - {nome: "MMR: lambda", valor: "0,7", parametro: "documento_extra.sumarizacao.lambda"}
      - {nome: "LexRank: limiar do cosseno", valor: "0,1", parametro: "documento_extra.sumarizacao.limiar"}
      - {nome: "Frases elegíveis", valor: "8 a 70 palavras, pontuação final, sem URL, legenda ou sumário"}
    equivale_a: "Resumos extrativos clássicos (sumy)."
    nao_e_igual_a: "Resumo gerado por LLM (abstrativo)."
    cuidados:
      - "As frases são do próprio documento e saem com página: conferir o contexto antes de citar."
      - "TextRank e LexRank não tratam redundância: o resumo executivo repetido no corpo pode entrar duas vezes; o MMR evita."
      - "Em PDFs, sumários e legendas podem passar pelos filtros; revise o resumo."
    referencias: [mihalcea2004, erkan2004, carbonell1998]
    deteccao: {snapshots: [documento_extra]}

  - id: sentimento_lexico
    nome: "Sentimento por léxico (exploratório)"
    familia: "PLN"
    status: implementado
    eap_id: "15.10"
    modulo: "app/services/analises/sentimento.py"
    o_que_mede: "A polaridade (positiva, neutra, negativa) de cada frase do corpo, resumida por documento, grupo e ano, com as frases mais positivas e mais negativas e a página."
    metrica: "Inglês: VADER (escore compound por frase; pacote vaderSentiment, licença MIT). Português e outros idiomas: léxico importado pelo usuário (OpLexicon, SentiLex-PT ou próprio): soma das polaridades com negação simples (3 palavras) normalizada por soma/raiz(soma^2 + 15); positivo >= 0,05 e negativo <= -0,05."
    formula: "escore = S / raiz(S^2 + 15), S = soma das polaridades (com inversão após negador nas 3 palavras anteriores)"
    parametros_padrao:
      - {nome: "Unidade", valor: "frase do corpo (sem referências nem ruído)"}
      - {nome: "Limiar de classe", valor: "|escore| >= 0,05"}
      - {nome: "Léxico PT/ES", valor: "o importado mais recente (guardado na configuração do usuário, fora do projeto)"}
    equivale_a: "Análise de sentimento baseada em léxico (VADER, SentiLex-PT, OpLexicon)."
    nao_e_igual_a: "Classificação supervisionada ou por LLM."
    cuidados:
      - "Uso exploratório: prosa acadêmica é quase toda neutra e os léxicos foram feitos para redes sociais e resenhas; termos técnicos ('risco', 'limitação') contam como negativos sem opinião, e linhas de tabela podem receber escores extremos."
      - "OpLexicon e SentiLex-PT não acompanham o Raio-X: a licença de redistribuição do OpLexicon não está clara e a do SentiLex-PT 02 (CC BY segundo o catálogo B2FIND) não foi confirmada na fonte primária. Baixe o arquivo e importe-o (conferir a licença antes de usar)."
    referencias: [hutto2014, souza2011, silva2012]
    deteccao: {}

