    equivale_a: "Classificação de texto com modelos de linguagem (zero-shot / few-shot prompting)."
    nao_e_igual_a: "Contagem de padrões do dicionário (6.4), que é determinística, e codificação humana."
    cuidados:
      - "Resultados variam entre execuções e modelos: o modelo e o hash do prompt ficam no log; meça a concordância com o humano (15.1)."
      - "A classificação é uma sugestão para triagem: revise item a item; no few-shot, os exemplos saem da avaliação para não haver vazamento."
      - "Modelos remotos recebem as unidades e cobram por token: veja a estimativa de custo (com e sem cache) antes de rodar."
