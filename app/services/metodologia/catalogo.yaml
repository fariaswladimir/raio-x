# Catálogo de metodologia do Raio-X: FONTE ÚNICA das análises, métodos e referências bibliográficas.
#
# Lido por app/services/metodologia/__init__.py (validação no carregamento), exposto em /api/metodologia e
# mostrado na tela "Metodologia" (frontend/metodologia.html). A seção 11 do EAP.md é um espelho desta lista.
#
# Estrutura
#   referencias:   pool de referências, indexado por chave (a chave só serve para reusar a mesma referência
#                  em várias análises; a chave BibTeX é calculada: sobrenome + ano + 1ª palavra do título).
#       autores    lista "Sobrenome, Iniciais" (et_al: true quando só o 1º autor é conhecido/usado)
#       ano, titulo, tipo (livro | artigo | congresso | capitulo | tese | software | relatorio | web | preprint)
#       veiculo    periódico, anais, livro (capítulo), instituição ou repositório
#       detalhes   volume, numero, paginas, edicao, local, editora, organizadores, evento (todos opcionais)
#       doi_ou_url, nota (opcionais)
#   analises:      uma entrada por análise/procedimento (campos em app/services/metodologia/__init__.py)
#       parametros_padrao   lista de {nome, valor, parametro?}; "parametro" = chave em parametros.json do projeto
#       deteccao            como saber se o projeto usou a análise: snapshots (tabela analise), arquivos (cache), tabelas
#
# Referências marcadas com nota "conferir antes de citar" foram compiladas de memória (Frente 15) e precisam
# de verificação de DOI, páginas e edição.

