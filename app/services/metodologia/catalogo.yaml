analises:
  # =====================================================================================================
  # Preparação do corpus
  # =====================================================================================================
  - id: conversao_docling
    nome: "Conversão de documentos (Docling) e OCR"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "2.4, 2.6"
    modulo: "app/services/etapas/conversao.py"
    o_que_mede: "Não mede: transforma PDF/DOCX em Markdown com marcador de página (<!-- página N -->), para que toda citação traga a página exata."
    metrica: "Conversão com o Docling (layout, tabelas, ordem de leitura). Arquivos .md e .txt entram sem conversão. PDFs escaneados podem passar por OCR (RapidOCR, offline), por documento."
    parametros_padrao:
      - {nome: "OCR", valor: "desligado (pode ser forçado por documento)", parametro: "conversao.ocr"}
      - {nome: "Idioma do OCR", valor: "primeiro idioma de 'idioma'", parametro: "idioma"}
    equivale_a: "Mesma saída do Corpus_Docling da MLR."
    nao_e_igual_a: "Texto extraído por copiar e colar do PDF, que mistura colunas, cabeçalhos e rodapés."
    cuidados:
      - "OCR introduz ruído (por exemplo 'AI' lido como 'Al'); revise documentos escaneados antes de interpretar frequências."
      - "O Docling pode extrair 0 caracteres de PDFs com camada de texto inútil; nesse caso use o OCR de página inteira."
    referencias: [auer2024]
    deteccao: {arquivos: ["cache/md"]}

  - id: limpeza_estrutura
    nome: "Limpeza do texto e detecção de seções"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "3.1, 3.2, 3.3"
    modulo: "app/services/limpeza_texto.py"
    o_que_mede: "Não mede: separa o corpo do texto de referências, apêndices e ruído, e marca cada trecho com página e seção."
    metrica: "Remove cabeçalho/rodapé repetidos (linhas em pelo menos 50% das páginas, em documentos com 4 ou mais páginas), números de página, URLs, e-mails, DOI e hifenização de fim de linha; detecta seções por título (EN/PT/ES) ou, sem título, por heurística; exclui as seções configuradas da contagem."
    parametros_padrao:
      - {nome: "Excluir referências da contagem", valor: "sim", parametro: "excluir_referencias"}
      - {nome: "Seções excluídas", valor: "referencias, apendice, agradecimentos, declaracoes", parametro: "excluir_secoes"}
    equivale_a: "Pré-processamento de corpus descrito em Denny e Spirling (2018); as decisões são registradas nos parâmetros do projeto."
    nao_e_igual_a: "Limpeza do Voyant, que conta entidades HTML, títulos de seção e URLs (diferença mediana de 1,3% nos tokens por documento no corpus MLR)."
    cuidados:
      - "A detecção heurística de referências (sem título) acerta o tamanho certo em cerca de 73% dos casos validados; confira o painel de seções."
      - "Decisões de pré-processamento alteram os resultados: mantenha o parâmetros.json versionado junto do relatório."
    referencias: [denny2018]
    deteccao: {arquivos: ["cache/limpo"]}

  - id: qualidade_duplicatas
    nome: "Controle de qualidade e duplicatas próximas"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "2.5"
    modulo: "app/services/etapas/qualidade.py"
    o_que_mede: "Sinaliza documentos vazios, escaneados, de idioma inesperado ou duplicados, e lista pendências para decisão do usuário."
    metrica: "Duplicata exata por sha256; por título normalizado idêntico; por similaridade de cosseno TF-IDF sobre os lemas maior ou igual a 0,95. O usuário decide excluir ou não da análise."
    formula: "cos(d, e) = v(d) . v(e), com v = vetor TF-IDF normalizado (L2); duplicata provável se cos >= 0,95"
    parametros_padrao:
      - {nome: "Limiar de cosseno para duplicata próxima", valor: "0,95"}
      - {nome: "Tamanho mínimo do documento", valor: "cerca de 200 palavras (abaixo disso o documento é sinalizado)"}
    equivale_a: "Detecção de quase-duplicatas por cosseno TF-IDF, prática comum em recuperação de informação."
    nao_e_igual_a: "Comparação byte a byte: documentos com bytes diferentes (outra conversão do mesmo PDF) só são pegos pelo cosseno."
    cuidados:
      - "O sistema apenas avisa; a exclusão é decisão do usuário e é reversível."
    referencias: [salton1988, manning2008]
    deteccao: {arquivos: ["cache/md"]}

  - id: lematizacao
    nome: "Tokenização e lematização"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "4.1"
    modulo: "app/services/tokenizacao.py"
    o_que_mede: "Não mede: divide o texto em palavras e agrupa as formas flexionadas sob um lema (agents e agent contam como 'agent')."
    metrica: "Tokenização com siglas em caixa alta preservadas; lematização por tabela de consulta (simplemma) em inglês, português e espanhol, com idioma detectado por documento e lista de exceções (lemas errados corrigidos). Cada token guarda forma, lema, página e seção."
    parametros_padrao:
      - {nome: "Lematização", valor: "ativa (simplemma)", parametro: "lematizacao"}
      - {nome: "Idiomas", valor: "en, pt", parametro: "idioma"}
    equivale_a: "Lematização do IRaMuTeQ e do TXM; o spaCy (4.5, opcional) é a alternativa para lematização e classes gramaticais."
    nao_e_igual_a: "Contagem por forma (Voyant sem lematização): os números diferem."
    cuidados:
      - "Há erros conhecidos do dicionário inglês da simplemma (growing lido como 'growe'); a lista padrão de exceções corrige os mais frequentes."
      - "Medição no corpus MLR: no máximo 0,85% dos tokens ficam com lema ausente do corpus."
    referencias: [denny2018, honnibal2020]
    deteccao: {arquivos: ["cache/tokens"]}

  - id: palavras_vazias
    nome: "Palavras vazias (stopwords)"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "4.2"
    modulo: "app/services/palavras_vazias.py"
    o_que_mede: "Não mede: define quais palavras funcionais (de, the, que) saem dos rankings."
    metrica: "Listas EN/PT/ES, lista acadêmica (et, al, fig, doi, arxiv, https) e lista própria do projeto. O filtro é aplicado na consulta, não nos tokens: mudar a lista não reprocessa o corpus."
    parametros_padrao:
      - {nome: "Listas ativas", valor: "en, pt, es e acadêmica", parametro: "palavras_vazias"}
    equivale_a: "Listas do protótipo voyant-local; stoplists do AntConc e do Voyant."
    nao_e_igual_a: "Filtro por classe gramatical (4.5, planejado)."
    cuidados:
      - "O tamanho do corpus (denominador das frequências por 10 mil) mantém as palavras vazias, como o Voyant."
      - "Listas diferentes produzem rankings diferentes: registre a lista usada."
    referencias: [denny2018]
    deteccao: {arquivos: ["cache/vocabulario.json"]}

  - id: segmentacao
    nome: "Segmentação em segmentos de texto"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "4.4"
    modulo: "app/services/segmentacao.py"
    o_que_mede: "Não mede: divide o corpo do texto em segmentos de cerca de 40 palavras, unidade de contexto da CHD de Reinert."
    metrica: "Corte na melhor pontuação perto do alvo (. ? ! maior que ; : maior que vírgula), janela de 0,75 a 1,25 vezes o alvo, nunca atravessa bloco (página ou seção); cauda menor que 25% do alvo é anexada ao segmento anterior."
    parametros_padrao:
      - {nome: "Palavras por segmento", valor: "40", parametro: "segmento_palavras"}
    equivale_a: "Segmentos de texto (ST) do IRaMuTeQ e do Alceste."
    nao_e_igual_a: "Segmentos do IRaMuTeQ um a um: este sistema conta palavras do corpo com as vazias e fecha o segmento no fim da página ou seção."
    cuidados:
      - "A comparação com os segmentos do IRaMuTeQ fica para a validação cruzada (12.2)."
    referencias: [reinert1983, reinert1990, camargo2013]
    deteccao: {arquivos: ["cache/segmentos"]}

  - id: segmentos_ruido
    nome: "Detector de segmentos de ruído"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "3.4"
    modulo: "app/services/ruido.py"
    o_que_mede: "Não mede: marca segmentos de texto que não são prosa (listas de autores e afiliações, tabelas de regressão ou estatística, texto repetitivo e cláusulas repetidas entre documentos) para tirá-los da CHD, da similitude e dos n-gramas."
    metrica: "Regras conservadoras sobre a forma do segmento: fração de itens numéricos ou símbolos (tabela), fração de itens em maiúscula com poucas palavras de prosa e separadores de lista (autores), razão tipo/ocorrência muito baixa (repetitivo) e cobertura por sequências de 6 palavras presentes em vários documentos (cláusula repetida). Cada segmento marcado guarda o motivo."
    parametros_padrao:
      - {nome: "Excluir ruído das análises", valor: "sim", parametro: "limpeza.excluir_ruido"}
      - {nome: "Fração numérica mínima (tabela)", valor: "0,45"}
      - {nome: "Fração de maiúsculas mínima (autores)", valor: "0,60"}
      - {nome: "Documentos mínimos da cláusula repetida", valor: "4"}
    equivale_a: "Limpeza manual de listas de autores e tabelas antes da CHD no IRaMuTeQ."
    nao_e_igual_a: "Remoção de texto do corpus: os segmentos continuam no KWIC, com marca, e o detector pode ser desligado."
    cuidados:
      - "O detector olha só a forma do texto; tabelas com muito texto nas células e listas de autores com poucas vírgulas escapam."
      - "As contagens por documento aparecem nas pendências; confira uma amostra antes de relatar o filtro."
    referencias: []
    deteccao: {arquivos: ["cache/ruido"]}

  - id: termos_compostos
    nome: "Termos compostos (multiword terms)"
    familia: "Preparação do corpus"
    status: implementado
    eap_id: "4.3"
    modulo: "app/services/termos_compostos.py"
    o_que_mede: "Detecta sequências de 2 a 3 lemas que funcionam como um só termo (agentic ai, large language model) e as passa a contar como uma unidade."
    metrica: "Candidatos contíguos no mesmo bloco, sem palavra vazia nas bordas, pontuados pelo log-likelihood (G2 de Dunning) do par adjacente (trigramas: mínimo dos bigramas internos); filtros de frequência, documentos, concentração e regex de ruído; lista do usuário e bloqueados."
    formula: "G2 = 2 * soma(O_ij * ln(O_ij / E_ij)) sobre a tabela 2x2 dos pares adjacentes"
    parametros_padrao:
      - {nome: "Tamanho máximo (n)", valor: "3", parametro: "termos_compostos.n_max"}
      - {nome: "Frequência mínima", valor: "10", parametro: "termos_compostos.min_freq"}
      - {nome: "Documentos mínimos", valor: "3", parametro: "termos_compostos.min_docs"}
      - {nome: "Máximo de termos automáticos", valor: "200", parametro: "termos_compostos.max_automaticos"}
      - {nome: "Concentração máxima em um documento", valor: "0,8", parametro: "termos_compostos.max_concentracao"}
    equivale_a: "Extração de multiword terms; colocações de expressões do quanteda (textstat_collocations)."
    nao_e_igual_a: "N-gramas (5.5): lista exaustiva sem teste de associação."
    cuidados:
      - "Há ruídos conhecidos (trigramas com 'of', resíduos de tabela, erros de lema): revise e bloqueie no painel."
      - "A chave interna do termo é o lema; a exibição usa a forma original mais frequente."
    referencias: [dunning1993, evert2005]
    deteccao: {arquivos: ["cache/termos_compostos.json"]}

  - id: classes_gramaticais
    nome: "Classes gramaticais e entidades (spaCy, opcional)"
    familia: "PLN"
    status: implementado
    eap_id: "4.5"
    modulo: "app/services/spacy_nlp.py"
    o_que_mede: "Marca cada palavra com sua classe gramatical (UPOS) e reconhece entidades nomeadas (ORG, PERSON, GPE...), para filtros como 'só substantivos' e para listar entidades por documento e no corpus, com link para o KWIC."
    metrica: "Modelos pequenos do spaCy (en_core_web_sm, pt_core_news_sm; espanhol sem modelo), em arquivo lateral cache/spacy/<id>.json (POS, lema do spaCy e entidades) alinhado aos tokens sem alterar cache/tokens. Opções: lematização 'spacy' (padrão continua simplemma), filtro de classes nas frequências, formas ativas da CHD só com substantivos, adjetivos e verbos e termos compostos só de substantivos e adjetivos."
    parametros_padrao:
      - {nome: "POS e NER", valor: "ligados se o spaCy estiver instalado", parametro: "spacy.pos_ner"}
      - {nome: "Lematização", valor: "simplemma (ou spacy)", parametro: "lematizacao.metodo"}
      - {nome: "Formas ativas da CHD", valor: "todas as plenas (ou só as classes escolhidas)", parametro: "reinert.formas_ativas"}
      - {nome: "Classes dos termos compostos", valor: "qualquer (ou só as escolhidas)", parametro: "termos_compostos.classes"}
    equivale_a: "Filtros por classe gramatical do KH Coder e do IRaMuTeQ (formas ativas: substantivos, adjetivos, verbos)."
    nao_e_igual_a: "Filtro por lista de palavras vazias."
    cuidados:
      - "Opcional: instalar_spacy.bat (cerca de 170 MB). Sem o spaCy, as opções aparecem como 'não instalado' e o Raio-X segue com a simplemma."
      - "Os modelos pequenos erram em prosa acadêmica: siglas e termos técnicos viram ORG, PERSON ou GPE ('AI' como GPE); trate as entidades como pista e confira no KWIC."
    referencias: [honnibal2020]
    deteccao: {arquivos: ["cache/spacy"]}

  # =====================================================================================================
  # Linguística de corpus
  # =====================================================================================================
  - id: frequencias
    nome: "Frequências, nuvem e tendências"
    familia: "Linguística de corpus"
    status: implementado
    eap_id: "5.2"
    modulo: "app/services/analises/frequencias.py"
    o_que_mede: "Quantas vezes cada lema (ou forma) aparece e em quantos documentos; como a frequência varia por documento, ano ou grupo."
    metrica: "freq = ocorrências no escopo; por 10 mil = freq / tokens contados do escopo x 10.000; documentos = quantos documentos do escopo têm o termo. Tendências somam as formas que casam com um curinga (agent*)."
    formula: "por_10k = freq / N_tokens_contados * 10000"
    parametros_padrao:
      - {nome: "Unidade", valor: "lema"}
      - {nome: "Palavras vazias", valor: "filtradas na consulta", parametro: "palavras_vazias"}
      - {nome: "Escopo", valor: "corpus (também documento, grupo ou ano)"}
    equivale_a: "Voyant Terms/Cirrus/Trends, IRaMuTeQ, AntConc Word list (com lematização)."
    nao_e_igual_a: "Voyant sem lematização: os números diferem."
    cuidados:
      - "Frequências brutas dependem do tamanho do documento: compare pela frequência por 10 mil."
      - "Termos concentrados em poucos documentos podem dominar o ranking; confira a coluna de documentos."
    referencias: [lebart1998, rockwell2016, sinclair2016voyant]
    deteccao: {snapshots: [frequencias], arquivos: ["cache/vocabulario.json"]}

  - id: kwic
    nome: "Concordância (KWIC)"
    familia: "Linguística de corpus"
    status: implementado
    eap_id: "5.3"
    modulo: "app/services/analises/kwic.py"
    o_que_mede: "Mostra cada ocorrência de um termo ou frase com o contexto à esquerda e à direita, a página e a citação."
    metrica: "Janela de N palavras de cada lado, lida do texto limpo do bloco (a pontuação original é preservada); consulta por lema, forma ou termo composto, com curinga e frases entre aspas."
    parametros_padrao:
      - {nome: "Janela", valor: "10 palavras de cada lado", parametro: "kwic_janela"}
      - {nome: "Unidade", valor: "lema"}
    equivale_a: "Contexts do Voyant e Concordance do AntConc."
    nao_e_igual_a: "Busca de texto simples: casa por lema e respeita fronteira de bloco."
    cuidados:
      - "Se a janela atravessa uma página ou seção, os trechos são unidos por reticências para não sugerir continuidade que o texto não tem."
    referencias: [luhn1960, sinclair1991, anthony2024]
    deteccao: {arquivos: ["cache/tokens"]}

  - id: colocacoes
    nome: "Colocações (LL, MI, t-score, logDice)"
    familia: "Linguística de corpus"
    status: parcial
    eap_id: "5.4"
    modulo: "app/services/analises/colocacoes.py"
    o_que_mede: "Quais palavras aparecem perto de um termo-nó mais do que o acaso esperaria."
    metrica: "Tabela 2x2 de coocorrência de superfície (notação de Evert: O11, R1, C1, N), janelas sobrepostas unidas (cada token conta uma vez). LL = G2 com sinal; MI = log2(O11/E11); t-score; logDice."
    formula: "G2 = 2 * soma(O_ij * ln(O_ij/E_ij)); MI = log2(O11/E11); t = (O11 - E11)/sqrt(O11); logDice = 14 + log2(2*O11/(R1 + C1))"
    parametros_padrao:
      - {nome: "Janela (esquerda/direita)", valor: "5 palavras de cada lado", parametro: "colocacao_janela"}
      - {nome: "Frequência mínima do par (O11)", valor: "3"}
      - {nome: "Frequência mínima do colocado (C1)", valor: "5"}
      - {nome: "Fronteira", valor: "bloco (página/seção); 'documento' para comparar com o AntConc"}
    equivale_a: "Collocates do AntConc e do LancsBox (LL, MI)."
    nao_e_igual_a: "Voyant Collocates (só contagem) e quanteda textstat_collocations (expressões de várias palavras)."
    cuidados:
      - "MI favorece colocados raros: use com frequência mínima."
      - "Falta a conferência de 3 termos contra o AntConc (roteiro em docs/validacao_antconc.md); por isso o status é parcial."
    referencias: [church1990, dunning1993, evert2005, evert2008, rychly2008]
    deteccao: {arquivos: ["cache/tokens"]}

  - id: ngramas
    nome: "N-gramas (clusters, lexical bundles)"
    familia: "Linguística de corpus"
    status: implementado
    eap_id: "5.5"
    modulo: "app/services/analises/ngramas.py"
    o_que_mede: "Sequências contíguas de 2 a 6 palavras e quantas vezes (e em quantos documentos) se repetem."
    metrica: "Contagem exaustiva por forma ou lema; contíguo no mesmo bloco, sem parágrafo entre as palavras; concentração = parcela das ocorrências no documento onde o n-grama é mais frequente."
    parametros_padrao:
      - {nome: "Tamanho (n)", valor: "2 a 6 palavras"}
      - {nome: "Frequência mínima", valor: "3"}
      - {nome: "Documentos mínimos", valor: "2"}
      - {nome: "Unidade", valor: "forma"}
      - {nome: "Palavras vazias", valor: "sem_bordas (descarta n-gramas que começam ou terminam com palavra vazia)"}
      - {nome: "Pontuação", valor: "quebra a sequência"}
    equivale_a: "AntConc Clusters/N-Grams e Voyant Phrases."
    nao_e_igual_a: "Termos compostos (4.3): lista curada com log-likelihood. Também não é textstat_collocations do quanteda."
    cuidados:
      - "N-gramas longos refletem resíduos de tabela e repetição; use a coluna de concentração para filtrar."
      - "Não há teste de associação: frequência alta não significa expressão fixa."
    referencias: [biber2004, anthony2024]
    deteccao: {arquivos: ["cache/tokens"]}

  # =====================================================================================================
  # Estatística textual / lexicometria
  # =====================================================================================================
  - id: diversidade_lexical
    nome: "Diversidade lexical (MATTR)"
    familia: "Estatística textual / lexicometria"
    status: implementado
    eap_id: "5.1"
    modulo: "app/services/analises/resumo.py"
    o_que_mede: "A variedade do vocabulário de um documento, sem depender do seu tamanho."
    metrica: "Média móvel da razão tipo/ocorrência: em cada janela de 500 palavras consecutivas calcula-se tipos/500, e o MATTR é a média de todas as janelas. Documentos com menos de 500 tokens usam a razão simples e ficam fora dos rankings."
    formula: "MATTR = média sobre as janelas de (tipos distintos na janela / 500)"
    parametros_padrao:
      - {nome: "Janela", valor: "500 palavras"}
      - {nome: "Palavras vazias", valor: "mantidas"}
    equivale_a: "MATTR do pacote de Covington e McFall (2010)."
    nao_e_igual_a: "TTR simples do Voyant (depende do tamanho do texto)."
    cuidados:
      - "Só compare MATTR de documentos com a mesma janela e o mesmo pré-processamento."
      - "Textos curtos (menos de 500 tokens) não têm janela completa."
    referencias: [covington2010, mccarthy2010]
    deteccao: {snapshots: [resumo]}

  - id: tfidf_termos_distintivos
    nome: "Termos distintivos por documento (TF-IDF)"
    familia: "Estatística textual / lexicometria"
    status: implementado
    eap_id: "5.1"
    modulo: "app/services/analises/resumo.py"
    o_que_mede: "Quais lemas caracterizam um documento frente ao resto do corpus."
    metrica: "tf = freq / tokens contados do documento; idf = ln(N / df). Termos presentes em todos os documentos têm idf 0 e não aparecem. Apenas lemas sem palavras vazias e com frequência mínima no documento."
    formula: "tfidf(t, d) = (freq(t, d) / n_d) * ln(N / df(t))"
    parametros_padrao:
      - {nome: "Frequência mínima no documento", valor: "3"}
      - {nome: "Termos por documento", valor: "10"}
    equivale_a: "Termos distintivos do Voyant."
    nao_e_igual_a: "Keyness (6.1): TF-IDF não testa diferença estatística entre grupos."
    cuidados:
      - "É um indicador descritivo, não um teste: não cite como 'palavras-chave significativas'."
    referencias: [sparckjones1972, salton1988, manning2008]
    deteccao: {snapshots: [resumo]}

  - id: especificidades
    nome: "Especificidades (Lafon)"
    familia: "Estatística textual / lexicometria"
    status: parcial
    eap_id: "6.2"
    modulo: "app/services/analises/especificidades.py"
    o_que_mede: "Quais termos estão sobre-representados ou sub-representados em cada parte do corpus (ano, grupo ou documento)."
    metrica: "Modelo hipergeométrico de Lafon: score = -log10 P(X >= f) quando f é maior ou igual ao esperado F*t/T, e +log10 P(X <= f) quando menor; teto de 50; termos banais quando |score| < limiar."
    formula: "score(+) = -log10 P(X >= f); score(-) = +log10 P(X <= f); X ~ Hipergeométrica(T, F, t)"
    parametros_padrao:
      - {nome: "Limiar de banalidade", valor: "|score| < 2"}
      - {nome: "Teto do score", valor: "50 (mostra '> 50')"}
      - {nome: "Frequência mínima", valor: "5"}
      - {nome: "Partição", valor: "ano (também grupo ou documento)"}
    equivale_a: "TXM Especificidades, Lexico e IRaMuTeQ especificidades."
    nao_e_igual_a: "Keyness LL contra o resto (6.1) e keyness contra corpus de referência externo (15.8)."
    cuidados:
      - "O lado da cauda é decidido pela média; o TXM decide pela moda, e a diferença só aparece na zona banal."
      - "Falta a conferência contra o TXM (a validação foi contra o cálculo exato); por isso o status é parcial."
    referencias: [lafon1980, lafon1984, lebart1998, heiden2010]
    deteccao: {snapshots: [especificidades]}

  # =====================================================================================================
  # Comparação entre grupos
  # =====================================================================================================
  - id: keyness
    nome: "Palavras-chave entre grupos (keyness)"
    familia: "Comparação entre grupos"
    status: implementado
    eap_id: "6.1"
    modulo: "app/services/analises/keyness.py"
    o_que_mede: "Quais termos são mais (ou menos) frequentes em um grupo de documentos do que em outro, com significância e tamanho de efeito."
    metrica: "G2 de 2 células com sinal (log-likelihood, Rayson e Garside), Log Ratio de Hardie (0,5 no lugar de zero) e %DIFF, mais frequência por 10 mil, amplitude de documentos e p por qui-quadrado de 1 grau de liberdade (opcionalmente com Bonferroni)."
    formula: "G2 = 2 * (a ln(a/E1) + b ln(b/E2)); E1 = c(a+b)/(c+d), E2 = d(a+b)/(c+d); Log Ratio = log2((a/c)/(b/d))"
    parametros_padrao:
      - {nome: "Frequência mínima", valor: "5"}
      - {nome: "Documentos mínimos por lado", valor: "2"}
      - {nome: "Nível de significância (p)", valor: "0,01"}
      - {nome: "Ordenação", valor: "G2 (ou Log Ratio)"}
      - {nome: "Lado de referência", valor: "o resto do corpus ou um grupo escolhido"}
    equivale_a: "AntConc Keywords e quanteda textstat_keyness."
    nao_e_igual_a: "TF-IDF (termos distintivos do Voyant)."
    cuidados:
      - "G2 mede evidência, não tamanho do efeito: leia junto com o Log Ratio."
      - "Grupos pequenos (por exemplo 7 documentos) tornam o resultado sensível a um documento só; use o filtro de documentos mínimos."
      - "Palavras-chave dependem do corpus de comparação escolhido."
    referencias: [scott1997, rayson2000, hardie2014, gabrielatos2012, gabrielatos2018]
    deteccao: {snapshots: [keyness]}

  - id: keyness_referencia_externa
    nome: "Keyness contra corpus de referência externo"
    familia: "Comparação entre grupos"
    status: implementado
    eap_id: "15.8"
    modulo: "app/services/analises/keyness_referencia.py"
    o_que_mede: "Quais termos do corpus (inteiro, um grupo ou um ano) são incomuns em relação a uma lista de frequências importada (corpus de referência geral)."
    metrica: "Mesmas medidas da keyness entre grupos: G2 de 2 células com sinal, Log Ratio de Hardie (0,5 no lugar de zero) e %DIFF, com o corpus do projeto no lado A e a referência no lado B. A referência é um CSV/TSV 'termo;frequência' (total opcional) ou uma pasta de .txt contada com o mesmo tokenizador e lematizador; lista de formas é lematizada na importação. Termos fora da referência (OOV) têm b = 0 e vêm marcados."
    formula: "G2 = 2 * (a ln(a/E1) + b ln(b/E2)); E1 = c(a+b)/(c+d), E2 = d(a+b)/(c+d); c = palavras do corpus, d = palavras da referência"
    parametros_padrao:
      - {nome: "Unidade", valor: "lema (ou forma)"}
      - {nome: "Frequência mínima (a + b)", valor: "5"}
      - {nome: "Documentos mínimos do corpus", valor: "2"}
      - {nome: "Nível de significância (p)", valor: "0,01"}
      - {nome: "Fora da referência (OOV)", valor: "mostrar, marcadas (ou ocultar)"}
    equivale_a: "Keyword List do AntConc com corpus de referência e KeyWords do WordSmith."
    nao_e_igual_a: "Especificidades por parte (6.2) e keyness entre grupos do próprio corpus (6.1)."
    cuidados:
      - "A referência precisa ser comparável (mesmo idioma e, de preferência, gênero próximo): contra legendas ou notícias quase todo termo técnico vira palavra-chave. O Raio-X não traz corpus de referência (licenças): importe uma lista de um corpus que você pode usar."
      - "Lista truncada sem o total de palavras distorce as medidas (usa-se a soma da lista); informe o total real. A lematização da lista é feita sem contexto."
    referencias: [scott1997, rayson2000, hardie2014]
    deteccao: {arquivos: ["referencias"]}

  - id: dicionario_codebook
    nome: "Dicionário / codebook (contagem de categorias)"
    familia: "Comparação entre grupos"
    status: implementado
    eap_id: "6.4"
    modulo: "app/services/analises/dicionario.py"
    o_que_mede: "Quanto cada categoria do codebook aparece no corpus, por grupo, ano ou documento, e se difere entre grupos."
    metrica: "Ocorrências de padrões de lema ou forma (com curinga e frases) agrupados por categoria; por 10 mil tokens; documentos com pelo menos uma ocorrência; G2 e Log Ratio tratando a categoria como um termo."
    parametros_padrao:
      - {nome: "Unidade", valor: "lema"}
      - {nome: "Categorias", valor: "definidas no dicionario.yaml do projeto"}
    equivale_a: "quanteda dictionary (dfm_lookup) e regras de codificação do KH Coder."
    nao_e_igual_a: "Codificação manual de trechos (ATLAS.ti, NVivo)."
    cuidados:
      - "Categorias sem termos ficam fora dos números: o codebook importado não traz palavras-chave."
      - "Presença de um padrão não equivale ao código aplicado por um humano; valide por amostra."
    referencias: [grimmer2013, benoit2018, rayson2000, hardie2014]
    deteccao: {snapshots: [dicionario]}

  # =====================================================================================================
  # Similaridade e agrupamento
  # =====================================================================================================
  - id: similaridade_documentos
    nome: "Similaridade entre documentos (TF-IDF, cosseno, Ward, MDS)"
    familia: "Similaridade e agrupamento"
    status: implementado
    eap_id: "6.3"
    modulo: "app/services/analises/similaridade.py"
    o_que_mede: "Quão parecidos são os vocabulários de dois documentos, e que grupos de documentos temáticos emergem."
    metrica: "Matriz documento x termo (df entre 2 e 0,9 N), TF-IDF com tf sublinear e idf suavizado, norma L2; cosseno entre documentos; agrupamento hierárquico por Ward (padrão) ou ligação média; k informado ou automático por silhueta (2 a 8); mapa 2D por MDS clássico."
    formula: "tf = 1 + ln f; idf = ln((1+N)/(1+df)) + 1; cos(d,e) = v(d) . v(e); distância = 1 - cos"
    parametros_padrao:
      - {nome: "Unidade", valor: "lema"}
      - {nome: "Método de agrupamento", valor: "Ward"}
      - {nome: "k", valor: "automático por silhueta (2 a 8)"}
      - {nome: "df mínimo / máximo", valor: "2 documentos / 0,9 x N"}
      - {nome: "tf sublinear", valor: "sim"}
    equivale_a: "Similaridade e dendrograma do Lexos; mapa de documentos do Orange."
    nao_e_igual_a: "Termos distintivos do Voyant (TF-IDF sem agrupamento) e tópicos do LDA."
    cuidados:
      - "A ligação média pode separar por idioma; o Ward agrupou melhor por tema no corpus MLR."
      - "Documentos duplicados têm cosseno 1,00 e distorcem os grupos: revise as pendências."
      - "O número de grupos é uma escolha; a silhueta é só uma sugestão."
    referencias: [sparckjones1972, salton1988, manning2008, ward1963]
    deteccao: {snapshots: [similaridade]}

  - id: agrupamento_kmeans_espectral_pca
    nome: "k-means, agrupamento espectral e PCA dos documentos"
    familia: "Similaridade e agrupamento"
    status: implementado
    eap_id: "15.9"
    modulo: "app/services/analises/agrupamento.py"
    o_que_mede: "Agrupa documentos por outros algoritmos e projeta o corpus em poucas dimensões, para comparar com o Ward."
    metrica: "k-means (Lloyd, inicialização k-means++, 10 reinícios, semente fixa) e agrupamento espectral (Laplaciano normalizado do grafo kNN de cosseno, Ng-Jordan-Weiss) sobre a mesma matriz TF-IDF da similaridade; k pela maior silhueta (1 - cosseno) de 2 a 8; PCA por SVD do TF-IDF centrado; concordância com o corte do Ward no mesmo k pelo índice de Rand ajustado."
    formula: "||a - b||^2 = 2 (1 - cos) para vetores L2; L = I - D^(-1/2) W D^(-1/2); ARI = (índice - esperado) / (máximo - esperado)"
    parametros_padrao:
      - {nome: "Método", valor: "k-means (ou espectral)"}
      - {nome: "k", valor: "automático por silhueta (2 a 8)"}
      - {nome: "Reinícios / semente", valor: "10 / 42"}
      - {nome: "Vizinhos (espectral)", valor: "10"}
      - {nome: "Matriz", valor: "a da similaridade (lema, df entre 2 e 0,9 x N, tf sublinear)"}
    equivale_a: "KMeans, SpectralClustering e PCA do scikit-learn; agrupamentos do Orange."
    nao_e_igual_a: "Ward da similaridade (6.3), AFC (7.3) e tópicos (15.7); o mapa PCA não coincide com o MDS da similaridade."
    cuidados:
      - "k-means depende da semente e do k: o resultado é fixado por semente (42) e 10 reinícios."
      - "A silhueta é só uma sugestão de k; silhuetas abaixo de 0,25 indicam estrutura fraca (a do corpus MLR é ~0,11)."
      - "O ARI contra o Ward mede concordância entre partições, não qualidade; perto de 0 é acordo ao acaso."
    referencias: [ward1963, lloyd1982, arthur2007, ng2002, luxburg2007, jolliffe2016, hubert1985]
    deteccao: {}

  # =====================================================================================================
  # Temático
  # =====================================================================================================
  - id: afc
    nome: "Análise fatorial de correspondência (AFC)"
    familia: "Temático"
    status: implementado
    eap_id: "7.3"
    modulo: "app/services/analises/afc.py"
    o_que_mede: "Como termos e partes do corpus (anos, grupos ou documentos) se associam em poucos eixos."
    metrica: "AFC simples: SVD dos resíduos padronizados da tabela termo x parte; autovalores e percentual de inércia, coordenadas principais, contribuições (ctr) e cos2; inércia total = qui-quadrado / n."
    formula: "S = D_r^(-1/2) (P - r c') D_c^(-1/2); SVD de S; inércia = soma dos autovalores = chi2 / n"
    parametros_padrao:
      - {nome: "Número de termos", valor: "100 (até 500)"}
      - {nome: "Seleção dos termos", valor: "frequência (ou especificidade)"}
      - {nome: "Frequência mínima", valor: "5"}
      - {nome: "Partição", valor: "ano (também grupo ou documento)"}
      - {nome: "Eixos calculados", valor: "até 5"}
    equivale_a: "IRaMuTeQ AFC, TXM AFC, KH Coder Correspondence e Voyant ScatterPlot (modo CA)."
    nao_e_igual_a: "PCA."
    cuidados:
      - "Com 2 partes só há 1 eixo."
      - "Um documento atípico (ou duplicado) pode puxar um eixo inteiro; confira as contribuições."
      - "Eixos são resumos estatísticos, não temas: interprete olhando as contribuições dos termos."
    referencias: [benzecri1973, greenacre2017, lebart1998]
    deteccao: {snapshots: [afc]}

  - id: chd_reinert
    nome: "Classificação hierárquica descendente (Reinert)"
    familia: "Temático"
    status: implementado
    eap_id: "7.1"
    modulo: "app/services/analises/reinert.py"
    o_que_mede: "Classes de segmentos de texto com vocabulário característico (mundos lexicais)."
    metrica: "Tabela binária segmento x forma plena; divide-se sempre a maior classe: corte no eixo 1 da AFC da classe que maximiza o qui-quadrado da tabela 2 x formas, seguido de realocação gulosa enquanto o qui-quadrado aumenta. Classes descritas pelo qui-quadrado 2 x 2 (sem correção, com sinal) de formas e variáveis (documento, grupo, ano); segmentos típicos pela soma dos qui-quadrados; AFC classe x forma."
    formula: "chi2 = n (n S - N_A^2) / (N_A N_B), com S = soma_j a_j^2 / t_j (tabela 2 x formas das presenças)"
    parametros_padrao:
      - {nome: "Segmento", valor: "40 palavras (ver segmentação)", parametro: "segmento_palavras"}
      - {nome: "Classes terminais", valor: "10", parametro: "reinert"}
      - {nome: "Frequência mínima das formas ativas", valor: "3 (até 3.000 formas mais frequentes)", parametro: "reinert"}
      - {nome: "Tamanho mínimo de classe", valor: "automático: máx(5; 2,5% dos segmentos classificáveis)", parametro: "reinert"}
      - {nome: "Classificação", valor: "simples (dupla opcional: UC de 40 e 60 palavras, só classes estáveis)", parametro: "reinert"}
      - {nome: "Realocação", valor: "até 50 varreduras; o qui-quadrado nunca diminui"}
    equivale_a: "CHD do IRaMuTeQ e do ALCESTE."
    nao_e_igual_a: "Agrupamento hierárquico aglomerativo de palavras do KH Coder e tópicos do LDA."
    cuidados:
      - "Segmentos atípicos (listas de autores, tabelas, textos repetidos) tendem a formar classes inteiras: o detector de ruído (3.4) os tira por padrão; classes minúsculas restantes são descartadas e não contam como classe."
      - "Retenção abaixo de 75% pede cautela; a classificação dupla retém menos (só classes estáveis)."
      - "As classes não coincidem uma a uma com as do IRaMuTeQ (segmentação, lematização e realocação diferentes); compare forma a forma (EAP 12.2, docs/validacao_iramuteq.md)."
    referencias: [reinert1983, reinert1990, ratinaud2009, camargo2013]
    deteccao: {snapshots: [reinert]}

  - id: topicos
    nome: "Tópicos: LSA, NMF e LDA, com coerência"
    familia: "Temático"
    status: implementado
    eap_id: "7.4, 15.7"
    modulo: "app/services/analises/topicos.py"
    o_que_mede: "Temas latentes do corpus como distribuições de palavras, e a participação de cada tema por documento, ano ou grupo."
    metrica: "LSA (SVD truncada), NMF e LDA com semente fixa; coerência C_v, UMass e NPMI; perplexidade; tópicos por ano e grupo (aproximação de STM/DTM)."
    parametros_padrao:
      - {nome: "Modelo", valor: "LDA (Gibbs colapsado em blocos; NMF e LSA opcionais)"}
      - {nome: "K", valor: "8 (varredura 3-12 com coerência e perplexidade)"}
      - {nome: "Unidade", valor: "documento (ou segmento de ~40 palavras)"}
      - {nome: "Semente / iterações", valor: "42 / 1000 (aquecimento 500, amostras a cada 10)"}
      - {nome: "alfa / beta", valor: "50/K (0,1 com segmentos) / 0,01"}
      - {nome: "Termos", valor: "lemas plenos, df >= 2 e df/N <= 0,9"}
      - {nome: "Coerência", valor: "top-10; UMass por unidade; NPMI e C_v com janela deslizante de 110"}
    equivale_a: "Voyant Topics (LDA)."
    nao_e_igual_a: "CHD de Reinert e agrupamento de documentos."
    cuidados:
      - "O número de tópicos é uma escolha do pesquisador; coerência alta não garante interpretabilidade."
      - "LDA não é determinístico sem semente: registre a semente."
      - "Tópicos × ano/grupo são médias descritivas das proporções por documento, não STM nem DTM."
    referencias: [deerwester1990, lee1999, blei2003, roder2015, griffiths2004, mimno2011]
    deteccao: {}

  # =====================================================================================================
  # Redes
  # =====================================================================================================
  - id: similitude
