  hayes2007: {autores: ["Hayes, A. F.", "Krippendorff, K."], ano: 2007, titulo: "Answering the call for a standard reliability measure for coding data", tipo: artigo, veiculo: "Communication Methods and Measures", detalhes: {volume: "1", numero: "1", paginas: "77-89"}, nota: "conferir antes de citar"}
  mimno2011: {autores: ["Mimno, D.", "Wallach, H. M.", "Talley, E.", "Leenders, M.", "McCallum, A."], ano: 2011, titulo: "Optimizing semantic coherence in topic models", tipo: congresso, veiculo: "Proceedings of EMNLP 2011", detalhes: {paginas: "262-272"}, nota: "conferir antes de citar"}
  landis1977: {autores: ["Landis, J. R.", "Koch, G. G."], ano: 1977, titulo: "The measurement of observer agreement for categorical data", tipo: artigo, veiculo: "Biometrics", detalhes: {volume: "33", numero: "1", paginas: "159-174"}, nota: "conferir antes de citar"}
  krippendorff2011: {autores: ["Krippendorff, K."], ano: 2011, titulo: "Computing Krippendorff's Alpha-Reliability", tipo: relatorio, veiculo: "Annenberg School for Communication, University of Pennsylvania", nota: "conferir antes de citar"}
  fleiss1969: {autores: ["Fleiss, J. L.", "Cohen, J.", "Everitt, B. S."], ano: 1969, titulo: "Large sample standard errors of kappa and weighted kappa", tipo: artigo, veiculo: "Psychological Bulletin", detalhes: {volume: "72", numero: "5", paginas: "323-327"}, nota: "conferir antes de citar"}
  lewis2020: {autores: ["Lewis, P."], et_al: true, ano: 2020, titulo: "Retrieval-augmented generation for knowledge-intensive NLP tasks", tipo: congresso, veiculo: "Advances in NeurIPS 33", detalhes: {paginas: "9459-9474"}, nota: "conferir antes de citar"}
  robertson2009: {autores: ["Robertson, S.", "Zaragoza, H."], ano: 2009, titulo: "The probabilistic relevance framework: BM25 and beyond", tipo: artigo, veiculo: "Foundations and Trends in Information Retrieval", detalhes: {volume: "3", numero: "4", paginas: "333-389"}, nota: "conferir antes de citar"}
